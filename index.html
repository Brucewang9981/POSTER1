<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>海报提示词工作台 · Prompt Studio</title>
<style>
  :root{
    --bg:#F5F5F7; --page:#D3DDEA; --card:#FFFFFF; --card-2:#F5F5F7; --input:#FFFFFF;
    --line:rgba(0,0,0,.10); --line-2:rgba(0,0,0,.18);
    --text:#1D1D1F; --text-2:#424245; --text-3:#86868B;
    --blue:#0071E3; --blue-hov:#0077ED;
    --ph-bg:rgba(0,0,0,.06); --ph-tx:#86868B;
    --hl-tx:#0071E3; --hl-bg:rgba(0,113,227,.10);
    --r:18px; --r-sm:12px;
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:var(--page); color:var(--text); min-height:100vh;
    font:15px/1.6 -apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;letter-spacing:-.01em;
  }
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-thumb{background:rgba(0,0,0,.18);border-radius:8px;border:3px solid var(--bg)}
  button,input,select,textarea{font:inherit;color:inherit}
  button{cursor:pointer;background:none;border:none}
  .wrap{max-width:980px;margin:0 auto;padding:34px 22px 72px}

  /* ---------- Hero（浅色蓝调开场） ---------- */
  .hero{
    background:linear-gradient(180deg,#D8ECFB 0%,#EDF5FD 55%,var(--page) 100%);color:#1D1D1F;text-align:center;
    padding:56px 24px 62px;
  }
  .hero-logo{
    width:176px;height:176px;border-radius:44px;object-fit:cover;display:block;
    margin:0 auto 28px;box-shadow:0 24px 72px rgba(125,203,255,.55);
  }
  .hero h1{
    font-size:clamp(38px,6.2vw,64px);font-weight:700;letter-spacing:-.03em;line-height:1.08;
    margin:0 auto 14px;max-width:820px;
  }
  .hero p{
    font-size:clamp(17px,2.2vw,21px);font-weight:400;color:#515154;letter-spacing:0;
    margin:0 auto;max-width:640px;line-height:1.5;
  }

  /* ---------- 分栏标题（Apple 大标题：超大居中） ---------- */
  .panel{display:block;margin-bottom:110px;scroll-margin-top:76px}
  .top{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.72);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid var(--line)}
  .top-in{max-width:920px;margin:0 auto;padding:0 22px;height:52px;display:flex;align-items:center;gap:18px}
  .brand{display:flex;align-items:center;gap:11px;flex-shrink:0}
  .brand .mark{width:26px;height:26px;border-radius:8px;object-fit:cover;display:block}
  .brand b{font-size:15px;font-weight:600;letter-spacing:-.015em}
  .brand span{display:block;font-size:9.5px;color:var(--text-3);font-family:var(--mono);letter-spacing:.14em;margin-top:-3px}

  /* ---------- 分栏（Apple 大标题风 · 卡片框） ---------- */
  .panel{display:block;scroll-margin-top:76px;background:var(--card);border:1px solid var(--line);border-radius:28px;padding:50px 46px;box-shadow:0 1px 3px rgba(0,0,0,.04);margin-bottom:44px}
  @media (max-width:760px){ .panel,.perk{padding:30px 20px} }

  /* ---------- 卡片与字段 ---------- */
  .card{background:var(--bg);border:1px solid var(--line);border-radius:var(--r);padding:26px 26px 12px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
  .gen-grid .card{padding:34px 34px 26px;box-shadow:0 2px 14px rgba(0,0,0,.06)}
  .fld{margin-bottom:16px}
  .fld h4{font-size:13px;font-weight:600;color:var(--text-2);letter-spacing:.01em;margin-bottom:8px}
  .gen-grid .fld{margin-bottom:20px}
  .gen-grid .fld:last-child{margin-bottom:0}
  .fld h4{font-size:13px;font-weight:600;margin-bottom:6px;color:var(--text-2)}
  .fld h4 .tag{font-family:var(--mono);font-size:10.5px;font-weight:400;color:var(--text-3);margin-left:8px}
  .fld .hint{font-size:12px;color:var(--text-3);margin-bottom:8px}
  .inp{width:100%;background:var(--input);border:1px solid var(--line);border-radius:var(--r-sm);padding:13px 15px;font-size:15px;outline:none;transition:border-color .15s,box-shadow .15s;color:var(--text)}
  .inp::placeholder{color:#AEAEB2}
  .inp:hover{border-color:var(--line-2)}
  .inp:focus{border-color:var(--blue);box-shadow:0 0 0 3.5px rgba(0,113,227,.15)}
  textarea.inp{resize:vertical;line-height:1.65;min-height:44px}
  .sel{appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='10' viewBox='0 0 10 10'><path d='M1 3l4 4 4-4' stroke='%2386868B' stroke-width='1.4' fill='none' stroke-linecap='round'/></svg>");background-repeat:no-repeat;background-position:right 12px center;padding-right:32px}

  /* ---------- 高亮（浅色系：灰占位 / 蓝值） ---------- */
  .ph{display:inline-block;background:var(--ph-bg);color:var(--ph-tx);padding:0 8px;border-radius:6px;font-size:.92em;line-height:1.6;margin:1px 0;font-weight:500;border:1px solid rgba(0,0,0,.08)}
  .hl{display:inline-block;background:var(--hl-bg);color:var(--hl-tx);padding:0 8px;border-radius:6px;font-size:.92em;line-height:1.6;margin:1px 0;font-weight:600;border:1px solid rgba(0,113,227,.22)}

  /* ---------- 输出卡 ---------- */
  .out-card{margin-top:34px}
  .out-head{display:flex;align-items:center;gap:10px;margin-bottom:12px}
  .out-head h3{font-size:21px;font-weight:600;letter-spacing:-.02em}
  .out-foot{display:flex;flex-direction:column;align-items:flex-start;gap:10px;margin-top:16px}
  .btn-copy{
    display:inline-flex;align-items:center;gap:7px;padding:9px 20px;border-radius:980px;
    background:var(--blue);border:none;font-size:14px;font-weight:500;color:#FFF;transition:background .15s,transform .1s;flex-shrink:0;
  }
  .btn-copy:hover{background:var(--blue-hov)}
  .btn-copy:active{transform:scale(.97)}
  .btn-copy svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .out-box{background:var(--bg);border:1px solid var(--line);border-radius:var(--r);padding:20px 24px 18px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
  .out-body{
    font-size:14.5px;line-height:2;color:var(--text-2);
    max-height:380px;overflow:auto;white-space:pre-wrap;word-break:break-word;
  }

  /* ---------- 二版块海报参考 ---------- */
  .gen-grid{display:flex;flex-direction:column;gap:40px;align-items:stretch}
  @media (max-width:860px){ .gen-grid{gap:28px} }
.gen-ref{margin:0;text-align:center;align-self:center}
  .gen-ref img{width:100%;max-width:360px;height:auto;border-radius:16px;object-fit:cover;display:block;margin:0 auto;box-shadow:0 16px 44px rgba(0,0,0,.16);border:1px solid var(--line)}
  .gen-ref figcaption{font-size:12.5px;color:var(--text-3);margin-top:14px;letter-spacing:.02em}

  /* ---------- 模型说明（输出卡使用） ---------- */
  .case-model{font-size:14px;color:var(--text-3);margin-bottom:12px;display:flex;align-items:center;flex-wrap:wrap;gap:10px}
  .case-model b{color:var(--hl-tx);font-weight:600}
  .case-model a{
    display:inline-flex;align-items:center;gap:8px;
    background:var(--hl-tx);color:#FFF;font-weight:600;font-size:14px;line-height:1;
    text-decoration:none;padding:11px 20px 11px 22px;border-radius:980px;
    box-shadow:0 6px 16px rgba(0,113,227,.32);cursor:pointer;
    transition:background .16s,box-shadow .16s,transform .12s;
    -webkit-tap-highlight-color:transparent;
  }
  .case-model a::after{
    content:"";width:7px;height:7px;flex:0 0 auto;
    border-right:1.8px solid #FFF;border-bottom:1.8px solid #FFF;
    transform:rotate(-45deg);margin-top:-2px;opacity:.92;
  }
  .case-model a:hover{background:var(--blue-hov);box-shadow:0 9px 22px rgba(0,113,227,.42)}
  .case-model a:active{transform:scale(.96);box-shadow:0 4px 10px rgba(0,113,227,.3)}


  /* ---------- 页脚 · 法务链接 ---------- */
  .foot-legal{
    padding:34px 0 14px;text-align:center;font-size:13.5px;color:var(--text-3);
    display:flex;justify-content:center;align-items:center;gap:18px;
  }
  .foot-legal a{color:var(--text-3);text-decoration:none;transition:color .15s}
  .foot-legal a:hover{color:var(--text);text-decoration:underline}
  .foot-legal .sep{width:1px;height:14px;background:var(--line-2)}

  /* ---------- 法务条款浮层（服务协议 / 隐私政策，内容随单文件内嵌） ---------- */
  .doc-mask{position:fixed;inset:0;background:rgba(10,20,35,.55);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:none;z-index:120;padding:4vh 16px}
  .doc-mask.on{display:block}
  .doc-panel{
    background:var(--card);max-width:820px;height:92vh;margin:0 auto;border-radius:24px;
    display:flex;flex-direction:column;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.28);
  }
  .doc-top{
    display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line);
    flex:none;background:var(--card);border-radius:24px 24px 0 0;
  }
  .doc-top b{font-size:15px;font-weight:600;letter-spacing:-.01em}
  .doc-top .doc-close{
    margin-left:auto;width:30px;height:30px;border-radius:50%;background:rgba(0,0,0,.06);
    display:flex;align-items:center;justify-content:center;font-size:17px;line-height:1;color:var(--text-3);
  }
  .doc-top .doc-close:hover{background:rgba(0,0,0,.11);color:var(--text)}
  .doc-body{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:30px 34px 54px;font-size:14.5px;line-height:1.78;color:var(--text-2)}
  .doc-body h2{font-size:17px;font-weight:600;color:var(--text);letter-spacing:-.02em;margin:30px 0 10px}
  .doc-body h2:first-child{margin-top:0}
  .doc-body p{margin-bottom:11px}
  .doc-body ol{list-style:none;counter-reset:ds}
  .doc-body ol li{counter-increment:ds;position:relative;padding-left:30px;margin-bottom:9px}
  .doc-body ol li::before{content:counter(ds) ".";position:absolute;left:0;top:0;color:var(--blue);font-weight:600;font-family:var(--mono);font-size:13px}
  .doc-body strong{color:var(--text);font-weight:600}
  .doc-body .note{background:rgba(0,113,227,.07);border:1px solid rgba(0,113,227,.18);border-radius:14px;padding:16px 20px;font-size:13.5px;line-height:1.7;margin-bottom:28px}
  .doc-body .fill{background:rgba(255,59,48,.08);color:#C7362B;border-radius:5px;padding:0 5px;font-weight:600}
  .doc-sub{margin:4px 0 0;font-size:13px;color:var(--text-3)}
  @media (max-width:760px){
    .doc-mask{padding:0}
    .doc-panel{height:100vh;border-radius:0;max-width:none}
    .doc-top{border-radius:0}
    .doc-body{padding:24px 20px 60px}
  }

  /* ---------- 云服务状态 / AI 生成 ---------- */
  @media (max-width:560px){ .top-in{gap:10px} .top-state{display:none} }
  .top-state{margin-left:auto;font-size:12px;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:50%;min-width:0}
  .top-state.ok{color:var(--text-3)}
  .top-state.warn{color:#A65100}
  .out-meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
  .out-meta-tx{font-size:12px;color:var(--text-3)}
  .btn-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .btn-copy:disabled{opacity:.45;cursor:not-allowed}

  .toast{position:fixed;left:50%;bottom:32px;transform:translate(-50%,14px);background:rgba(29,29,31,.92);backdrop-filter:blur(10px);color:#FFF;padding:10px 22px;border-radius:980px;font-size:13.5px;opacity:0;pointer-events:none;transition:.25s;z-index:99;box-shadow:0 12px 32px rgba(0,0,0,.22)}
  .toast.on{opacity:1;transform:translate(-50%,0)}

  /* ---------- 手机端紧凑化（省空间，2026-10-02） ---------- */
  @media (max-width:640px){
    .hero{padding:26px 18px 30px}
    .hero-logo{width:92px;height:92px;border-radius:26px;margin:0 auto 14px;box-shadow:0 14px 36px rgba(125,203,255,.5)}
    .hero h1{font-size:26px;line-height:1.22;letter-spacing:-.02em;margin:0 auto 8px}
    .hero p{font-size:14px;line-height:1.5}
    .wrap{padding:16px 12px 56px}
    .panel{padding:18px 13px;border-radius:18px;margin-bottom:16px}
    .gen-grid{gap:16px}
    .gen-ref img{max-width:100%;border-radius:13px;box-shadow:0 8px 22px rgba(0,0,0,.13)}
    .gen-ref figcaption{margin-top:9px;font-size:11.5px}
    .gen-grid .card{padding:16px 13px 12px}
    .gen-grid .fld{margin-bottom:12px}
    .fld h4{font-size:12.5px;margin-bottom:5px}
    .inp{padding:11px 13px}
    .out-card{margin-top:16px}
    .out-box{padding:14px 14px 12px;border-radius:14px}
    .out-body{max-height:none;font-size:13.5px;line-height:1.85}
    .out-head h3{font-size:18px}
    .top-in{padding:0 13px;height:48px}
    .brand b{font-size:14px}
  }
</style>
</head>

/* ================= 状态 ================= */
const templates = JSON.parse(JSON.stringify(BUILTIN_TEMPLATES));
let cases = JSON.parse(JSON.stringify(BUILTIN_CASES));
let contentFromCloud = false;

/* 同名案例的图片走页面内置（构建时已内嵌为 data URI，任何发布方式都不会 404）；
   云端若给了完整的 https/data 图片地址，则以云端为准。 */
const LOCAL_IMG = {};
BUILTIN_CASES.forEach(function(c){ if(c.key && c.img) LOCAL_IMG[c.key] = c.img; });

function $(s,el){ return (el||document).querySelector(s); }
function $$(s,el){ return Array.from((el||document).querySelectorAll(s)); }
function esc(s){ return String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function toast(msg){
  const t=$('#toast'); t.textContent=msg; t.classList.add('on');
  clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove('on'),1800);
}
function placeholders(body){
  const set=new Set(); const re=/\{\{([^{}]+)\}\}/g; let m;
  while((m=re.exec(body))) set.add(m[1].trim());
  return Array.from(set);
}

/* ================= 01 生成（模板由云端下发） ================= */
const $out=$('#out'), btnCopy=$('#btn-copy');
const genState=$('#genState');
const $name=$('#f-name'), $addr=$('#f-addr'), $tel=$('#f-tel');
let lastPrompt='';

const loggedSource={};

function collect(){
  return {'公司名称':$name.value.trim(),'公司地址':$addr.value.trim(),'公司电话':$tel.value.trim()};
}
function build(){
  const t=templates[0];
  if(!t || !t.body){ $out.textContent='模板缺失。'; return; }
  const vals=collect();
  let raw=t.body.replace(/\{\{([^{}]+)\}\}/g,(m,key)=>{
    const k=key.trim();
    return (k in vals && String(vals[k]).length) ? '\u0001'+String(vals[k])+'\u0003' : '\u0002'+k+'\u0004';
  });
  $out.innerHTML=esc(raw)
    .replace(/\u0001/g,'<span class="hl">').replace(/\u0003/g,'</span>')
    .replace(/\u0002/g,'<span class="ph">{{').replace(/\u0004/g,'}}</span>');
  lastPrompt=t.body.replace(/\{\{([^{}]+)\}\}/g,(m,key)=>{
    const k=key.trim(); return (k in vals && String(vals[k]).length)?String(vals[k]):('{{'+k+'}}');
  });
  genState.textContent = contentFromCloud ? '由云端模板实时填充'
    : (cloud.ok ? '使用页面内置模板（云端暂无内容）' : '使用页面内置模板（云端未连接）');
}
['#f-name','#f-addr','#f-tel'].forEach(s=>{
  $(s).addEventListener('input',()=>build());
});
async function copyText(txt){
  try{ await navigator.clipboard.writeText(txt); }
  catch(e){
    const ta=document.createElement('textarea'); ta.value=txt; document.body.appendChild(ta);
    ta.select(); document.execCommand('copy'); ta.remove();
  }
  toast('已复制到剪贴板');
}
btnCopy.addEventListener('click',()=>{
  if(!lastPrompt){ toast('暂无可复制内容'); return; }
  copyText(lastPrompt);
  logUsage('template', lastPrompt, null);
});

function applyGenRef(){
  const $refWrap=$('#genRef'),$refImg=$('#genRefImg');
  if(!$refWrap) return;
  const c0=cases[0];
  if(c0&&c0.img){ $refImg.src=c0.img; $refWrap.style.display=''; }
  else{ $refWrap.style.display='none'; }
}

/* ================= 云端内容读取（云服务 · 数据库） ================= */
function setCloudState(kind,text){
  const el=$('#cloudState');
  if(!el) return;
  el.textContent=text;
  el.className='top-state'+(kind?' '+kind:'');
}
function toCaseVM(row){
  const raw=row.image_url||'';
  return {
    key:row.case_key, name:row.name, rank:row.rank,
    img:/^(https?:|data:)/i.test(raw) ? raw : (LOCAL_IMG[row.case_key]||''),
    prompt:row.prompt, model:row.model
  };
}
function toTemplateVM(row){
  return {
    key:row.template_key, name:row.name, scene:row.scene, body:row.body,
    model:row.model, fields:Array.isArray(row.fields)?row.fields:[]
  };
}
function checkTemplateFields(t){
  if(!t || !Array.isArray(t.fields) || !t.fields.length) return;
  const known=['公司名称','公司地址','公司电话'];
  const miss=t.fields.map(f=>f&&f.key).filter(k=>k && known.indexOf(k)<0);
  if(miss.length) genState.textContent+=' · 该模板还需要：'+miss.join('、');
}
async function loadCloudContent(){
  if(!cloud.ok){
    setCloudState('warn','云端未连接 · 使用内置内容');
    genState.textContent='页面内置模板（未连接云端：'+cloud.reason+'）';
    return;
  }
  setCloudState('','云端内容加载中…');
  try{
    let cRes,tRes;
    for(let attempt=0;attempt<2;attempt++){        // 网络抖动自动重试一次
      [cRes,tRes]=await Promise.all([
        cloud.client.database.from('studio_cases')
          .select('case_key, name, category, scene, image_url, prompt, model, rank, sort_order')
          .order('sort_order',{ascending:true}),
        cloud.client.database.from('studio_templates')
          .select('template_key, name, scene, fields, body, model, sort_order')
          .order('sort_order',{ascending:true})
      ]);
      if(!cRes.error && !tRes.error && (cRes.data||[]).length && (tRes.data||[]).length) break;
      if(attempt===0) await new Promise(r=>setTimeout(r,1500));
    }
    if(cRes.error) throw cRes.error;
    if(tRes.error) throw tRes.error;

    const rows=(Array.isArray(cRes.data)?cRes.data:[]).map(toCaseVM).filter(c=>c.prompt);
    const tpls=(Array.isArray(tRes.data)?tRes.data:[]).map(toTemplateVM).filter(t=>t.body);
    if(!rows.length || !tpls.length) throw new Error('云端内容为空');

    cases=rows;
    templates.length=0;
    tpls.forEach(t=>templates.push(t));
    contentFromCloud=true;

    build();
    applyGenRef();
    setCloudState('ok','云端已同步 · '+cases.length+' 个案例 / '+templates.length+' 套模板');
    checkTemplateFields(templates[0]);
  }catch(err){
    setCloudState('warn','云端读取失败 · 使用内置内容');
    genState.textContent='页面内置模板（云端读取失败）';
    console.warn('[cloud] content load failed:', (err&&(err.code||err.message))||String(err));
  }
}

/* ================= 使用记录（云端 · 复制时写入） ================= */
function cleanField(v,max){
  return String(v==null?'':v)
    .replace(/[\u0000-\u001F\u007F]+/g,' ')
    .replace(/\s+/g,' ')
    .trim()
    .slice(0,max||80);
}
const visitorId=(function(){
  try{
    const k='hp_visitor_id';
    let v=localStorage.getItem(k);
    if(!v){ v='v-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,10); localStorage.setItem(k,v); }
    return v;
  }catch(e){ return null; }
})();
async function logUsage(source,output,modelId){
  if(!cloud.ok || loggedSource[source]) return null;
  loggedSource[source]=true;
  try{
    const {error}=await cloud.client.database.from('studio_usage_logs').insert({
      visitor_id: visitorId,
      company_name: cleanField(collect()['公司名称'],120)||null,
      source: source,
      model: modelId?String(modelId).slice(0,64):null,
      case_key: (templates[0]&&templates[0].key)||null,
      output_text: String(output||'').slice(0,20000)
    });
    if(error){ console.warn('[cloud] usage log rejected:', error.code||'unknown'); return false; }
    return true;
  }catch(e){ console.warn('[cloud] usage log failed'); return false; }
}

/* ================= 初始化 ================= */
build();
applyGenRef();
loadCloudContent();

/* [兜底] 云端状态长时间停留在「加载中」时，转为明确的降级提示（避免看似一直转圈） */
(function(){
  var el=document.getElementById('cloudState');
  if(!el) return;
  setTimeout(function(){
    var t=el.textContent||'';
    if(t.indexOf('加载中')<0) return;              /* 已同步 / 已降级则不动 */
    el.textContent='云端未连接 · 使用内置内容';
    el.style.color='#8a6d3b';
  }, 9000);
})();

/* ================= 法务条款浮层（服务协议 / 隐私政策） =================
   正文由 build-standalone.py 从 terms.html / privacy.html 抽取后注入下方 template，
   单文件部署时不再依赖同目录的 html 文件。template 为空（未构建）时回退跳转原文件。 */
(function(){
  const DOCS={terms:{title:'服务协议'},privacy:{title:'隐私政策'}};
  const mask=$('#docMask'), body=$('#docBody'), title=$('#docTitle');
  let lastScroll=0;
  function open(key,push){
    const t=$('#doc-'+key);
    if(!t || !t.content || !t.content.childElementCount) return false;
    title.textContent=DOCS[key].title;
    body.replaceChildren(t.content.cloneNode(true));
    body.scrollTop=0;
    lastScroll=window.scrollY;
    mask.classList.add('on');
    document.body.style.overflow='hidden';
    if(push && location.hash!=='#'+key) history.pushState(null,'','#'+key);
    return true;
  }
  function close(){
    if(!mask.classList.contains('on')) return;
    mask.classList.remove('on');
    document.body.style.overflow='';
    if(location.hash==='#terms'||location.hash==='#privacy') history.pushState(null,'',location.pathname+location.search);
  }
  $$('[data-doc]').forEach(a=>a.addEventListener('click',e=>{
    if(open(a.dataset.doc,true)) e.preventDefault();   // 有内嵌正文 → 页内展开；否则走原始链接
  }));
  $('#docClose').addEventListener('click',close);
  mask.addEventListener('click',e=>{ if(e.target===mask) close(); });
  document.addEventListener('keydown',e=>{ if(e.key==='Escape') close(); });
  window.addEventListener('popstate',()=>{
    const k=location.hash.replace('#','');
    if(k==='terms'||k==='privacy') open(k,false); else close();
  });
  const hash=location.hash.replace('#','');
  if(hash==='terms'||hash==='privacy') open(hash,false);
})();
</script>
